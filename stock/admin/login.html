<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 - 재고 통합 관리</title>
    <meta name="theme-color" content="#667eea">
    <link rel="stylesheet" href="/stock/css/style.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--surface);
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--shadow-lg);
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .login-btn {
            width: 100%;
            height: 50px;
            font-size: 1.1rem;
            margin-top: 10px;
        }
        .error-message {
            color: var(--danger);
            font-size: 0.9rem;
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>📦 관리자 로그인</h1>
                <p class="text-muted">아이디와 비밀번호를 입력하세요.</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">아이디</label>
                    <input type="text" id="username" required placeholder="admin" style="width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 8px;">
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" required placeholder="••••••••" style="width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 8px;">
                </div>
                
                <button type="submit" id="submitBtn" class="btn btn-primary login-btn">
                    로그인
                </button>
            </form>
            
            <div id="errorMessage" class="error-message"></div>
            
            <div class="mt-4 text-center">
                <a href="/" class="text-muted" style="text-decoration: none; font-size: 0.9rem;">← 메인으로 돌아가기</a>
            </div>
        </div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/stock/js/config.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const errorMessage = document.getElementById('errorMessage');

        // 기본 도메인 설정 (아이디 뒤에 자동으로 붙음)
        const DEFAULT_DOMAIN = '@464.kr';

        // 이미 로그인되어 있는지 확인
        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                window.location.href = '/stock/admin/index.html';
            }
        }
        checkSession();

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            let id = usernameInput.value.trim();
            const password = passwordInput.value;
            
            if (!id || !password) return;

            // 아이디 형식에 @가 없으면 기본 도메인 추가
            const email = id.includes('@') ? id : id + DEFAULT_DOMAIN;
            
            // 상태 업데이트
            submitBtn.disabled = true;
            submitBtn.textContent = '로그인 중...';
            errorMessage.textContent = '';
            
            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email,
                    password
                });
                
                if (error) throw error;
                
                // 로그인 성공 시 이동
                window.location.href = '/stock/admin/index.html';
                
            } catch (err) {
                console.error('로그인 실패:', err.message);
                errorMessage.textContent = '로그인에 실패했습니다. 이메일과 비밀번호를 확인하세요.';
                submitBtn.disabled = false;
                submitBtn.textContent = '로그인';
                
                // 흔들림 효과
                loginForm.classList.add('shake');
                setTimeout(() => loginForm.classList.remove('shake'), 500);
            }
        });
    </script>
</body>
</html>
